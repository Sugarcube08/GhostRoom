name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [android, ios, macos, windows, linux, web]

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          cd client
          flutter pub get

      - name: Build
        run: |
          cd client
          if [ "${{ matrix.target }}" == "android" ]; then
            flutter build apk --release
            flutter build appbundle --release
          elif [ "${{ matrix.target }}" == "ios" ]; then
            flutter build ipa --release --no-codesign
          elif [ "${{ matrix.target }}" == "macos" ]; then
            flutter build macos --release
          elif [ "${{ matrix.target }}" == "linux" ]; then
            # Note: Building Linux on macOS is not natively supported by Flutter.
            # Usually, you need a Linux host to build the Linux binary.
            echo "⚠️ Flutter cannot build Linux binaries on a macOS host natively."
            echo "Skipping Linux build on macOS runner."
          elif [ "${{ matrix.target }}" == "windows" ]; then
            # Note: Building Windows on macOS is not natively supported by Flutter.
            echo "⚠️ Flutter cannot build Windows binaries on a macOS host natively."
            echo "Skipping Windows build on macOS runner."
          elif [ "${{ matrix.target }}" == "web" ]; then
            flutter build web --release
          fi
      
      - name: Package Artifacts
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "web" ]; then
            cd client/build/web && zip -r ../../../ghostroom-web.zip .
          elif [ "${{ matrix.target }}" == "macos" ]; then
            cd client/build/macos/Build/Products/Release && zip -r ../../../../../../ghostroom-macos.zip ghostroom.app
          elif [ "${{ matrix.target }}" == "ios" ]; then
            cp client/build/ios/ipa/*.ipa ghostroom-ios.ipa
          elif [ "${{ matrix.target }}" == "android" ]; then
            cp client/build/app/outputs/flutter-apk/app-release.apk ghostroom-android.apk
            cp client/build/app/outputs/bundle/release/app-release.aab ghostroom-android.aab
          fi

      - name: Upload Artifact
        if: success() && (matrix.target != 'linux' && matrix.target != 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: ghostroom-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums & version.json
        shell: bash
        run: |
          cd artifacts
          rm -f SHA256SUMS version.json
          sha256sum ghostroom-* > SHA256SUMS || true
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          python3 - <<PY
          import os, json, hashlib, glob
          from datetime import datetime, timezone
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          base_url = f"https://github.com/Sugarcube08/GhostRoom/releases/download/{tag}"
          
          def file_info(fn, display, fmt):
              if not os.path.isfile(fn): return None
              h = hashlib.sha256()
              with open(fn, "rb") as f:
                  while c := f.read(65536): h.update(c)
              return {
                  "name": display,
                  "format": fmt,
                  "filename": fn,
                  "url": f"{base_url}/{fn}",
                  "sha256": h.hexdigest(),
                  "size_bytes": os.path.getsize(fn)
              }
          
          platforms = {}
          apk = file_info("ghostroom-android.apk", "Android Package (APK)", "apk")
          if apk: platforms["android"] = apk
          
          appimage = file_info("ghostroom-linux-x86_64.AppImage", "Linux Universal AppImage", "appimage")
          deb = file_info("ghostroom-linux.deb", "Debian / Ubuntu Package (.deb)", "deb")
          tar = file_info("ghostroom-linux-x86_64.tar.gz", "Linux Standalone Bundle (.tar.gz)", "tar.gz")
          rpms = glob.glob("ghostroom-*.rpm")
          rpm = file_info(os.path.basename(rpms[0]), "Fedora / RHEL / openSUSE Package (.rpm)", "rpm") if rpms else None
          
          if appimage:
              platforms["linux"] = appimage
              platforms["linux_appimage"] = appimage
          elif tar:
              platforms["linux"] = tar
          elif deb:
              platforms["linux"] = deb
          
          if deb: platforms["linux_deb"] = deb
          if rpm: platforms["linux_rpm"] = rpm
          if tar: platforms["linux_tar"] = tar
          
          web = file_info("ghostroom-web.zip", "Web Release Archive", "zip")
          if web: platforms["web"] = web
          
          manifest = {
              "version": version,
              "release_date": datetime.now(timezone.utc).isoformat(),
              "release_url": f"https://github.com/Sugarcube08/GhostRoom/releases/tag/{tag}",
              "changelog": f"GhostRoom {tag}: Automated release build with verified SHA-256 integrity.",
              "platforms": platforms
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
